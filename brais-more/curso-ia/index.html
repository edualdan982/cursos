<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario de Estudio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar" role="navigation" aria-label="Navegación principal">
        <button id="themeToggle" class="theme-toggle" aria-label="Cambiar tema" type="button">
            <span id="themeIcon">☀️</span>
        </button>
        <h1 class="navbar-title">Diario de Estudio</h1>
        <div class="navbar-date" aria-live="polite">
            <span class="date-icon" aria-hidden="true">📅</span>
            <span id="currentDate">2026-10-04</span>
        </div>
        <div class="weekly-total" id="weeklyTotal">0 min esta semana</div>
        <div class="days-this-month" id="daysThisMonth">0 días este mes</div>
    </nav>

    <main class="container">
        <header class="streaks-header">
            <div class="streaks" id="streaksContainer">
                <div class="streak" id="streak">
                    <span class="streak-fire">🔥</span>
                    <span class="streak-number" id="streakNumber">0</span>
                    <span class="streak-label">días</span>
                </div>
                <div class="streak best" id="bestStreak">
                    <span class="streak-icon">🏆</span>
                    <span class="streak-number" id="bestStreakNumber">0</span>
                    <span class="streak-label">Mejor racha</span>
                </div>
            </div>
        </header>

        <form id="sessionForm" class="form">
            <div class="form-group">
                <label for="date">Fecha</label>
                <input type="date" id="date" name="date" required>
            </div>
            <div class="form-group">
                <label for="topic">Tema</label>
                <input type="text" id="topic" name="topic" placeholder="Ej: JavaScript, React, Algoritmos..." required>
            </div>
            <div class="form-group">
                <label for="minutes">Minutos</label>
                <input type="number" id="minutes" name="minutes" min="1" placeholder="Ej: 45" required>
            </div>
            <button type="submit" class="btn btn-primary">Guardar sesión</button>
        </form>

        <section class="sessions">
            <h2>Sesiones</h2>
            <ul id="sessionsList" class="sessions-list"></ul>
            <p id="emptyMessage" class="empty-message" hidden>No hay sesiones aún. ¡Añade tu primera sesión!</p>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>

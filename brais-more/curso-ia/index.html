<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario de Estudio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar" role="navigation" aria-label="Navegación principal">
        <button id="themeToggle" class="theme-toggle" aria-label="Cambiar tema" type="button">
            <span id="themeIcon">☀️</span>
        </button>
        <h1 class="navbar-title">Diario de Estudio</h1>
        <div class="navbar-date" aria-live="polite">
            <span class="date-icon" aria-hidden="true">📅</span>
            <span id="currentDate"></span>
        </div>
        <div class="weekly-total" id="weeklyTotal">0 min esta semana</div>
        <div class="days-this-month" id="daysThisMonth">0 días este mes</div>
    </nav>

    <main class="container">
        <header class="streaks-header">
            <div class="streaks" id="streaksContainer">
                <div class="streak" id="streak">
                    <span class="streak-fire">🔥</span>
                    <span class="streak-number" id="streakNumber">0</span>
                    <span class="streak-label" id="streakLabel">días</span>
                </div>
                <div class="streak best" id="bestStreak">
                    <span class="streak-icon">🏆</span>
                    <span class="streak-number" id="bestStreakNumber">0</span>
                    <span class="streak-label">Mejor racha</span>
                </div>
            </div>
        </header>

        <section class="weekly-goal" aria-label="Objetivo semanal">
            <div class="weekly-goal-header">
                <h2>Objetivo semanal</h2>
                <button type="button" id="editGoalBtn" class="btn-link">Fijar objetivo</button>
            </div>
            <div id="goalProgressView" hidden>
                <div id="goalProgressBar" class="goal-progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <div id="goalProgressFill" class="goal-progress-fill"></div>
                </div>
                <p class="goal-progress-text" id="goalProgressText"></p>
                <p class="goal-achieved" id="goalAchieved" hidden>¡Objetivo cumplido! 🎉</p>
            </div>
            <p id="goalEmptyView" class="goal-empty">Aún no has fijado un objetivo semanal.</p>
            <form id="goalForm" class="goal-form" hidden>
                <div class="form-group">
                    <label for="goalMinutes">Minutos por semana</label>
                    <input type="number" id="goalMinutes" name="goalMinutes" min="1" placeholder="Ej: 300">
                </div>
                <p id="goalError" class="goal-error" hidden>Introduce un número entero de minutos mayor que 0.</p>
                <div class="goal-form-actions">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <button type="button" id="clearGoalBtn" class="btn-link" hidden>Quitar objetivo</button>
                </div>
            </form>
        </section>

        <section class="heat-map" aria-label="Mapa de calor de estudio">
            <div class="heat-map-header">
                <h2>Actividad</h2>
                <select id="heatWeeksSelect" aria-label="Semanas mostradas">
                    <option value="8">8 semanas</option>
                    <option value="12" selected>12 semanas</option>
                    <option value="26">26 semanas</option>
                    <option value="52">52 semanas</option>
                </select>
            </div>
            <div class="heat-map-body">
                <div id="heatMapGrid" class="heat-map-grid"></div>
                <div id="heatTooltip" class="heat-tooltip" hidden></div>
            </div>
            <div class="heat-legend" aria-hidden="true">
                <span>Menos</span>
                <span class="heat-cell level-0"></span>
                <span class="heat-cell level-1"></span>
                <span class="heat-cell level-2"></span>
                <span class="heat-cell level-3"></span>
                <span class="heat-cell level-4"></span>
                <span>Más</span>
            </div>
        </section>

        <form id="sessionForm" class="form">
            <div class="form-group">
                <label for="date">Fecha</label>
                <input type="date" id="date" name="date" required>
            </div>
            <div class="form-group">
                <label for="topic">Tema</label>
                <input type="text" id="topic" name="topic" placeholder="Ej: JavaScript, React, Algoritmos..." required>
            </div>
            <div class="form-group">
                <label for="minutes">Minutos</label>
                <input type="number" id="minutes" name="minutes" min="1" placeholder="Ej: 45" required>
            </div>
            <button type="submit" class="btn btn-primary">Guardar sesión</button>
        </form>

        <section class="sessions">
            <h2>Sesiones</h2>
            <ul id="sessionsList" class="sessions-list"></ul>
            <p id="filterNotice" class="filter-notice" hidden>
                <span></span> <button type="button" id="clearFilterBtn" class="btn-link">Ver todo</button>
            </p>
            <p id="emptyMessage" class="empty-message" hidden>No hay sesiones aún. ¡Añade tu primera sesión!</p>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
